services:
  gateway:
    build: ./gateway
    ports:
      - "8080:80"
      - "8443:443"
    env_file: .env
    depends_on: [service_a, service_b]
    networks: [microservices]

  service_a:
    build: ./service_a
    ports: ["5001:5001"]
    env_file: .env
    networks: [microservices]

  service_b:
    build: ./service_b
    ports: ["5002:5002"]
    env_file: .env
    networks: [microservices]

networks:
  microservices:
    driver: bridge
