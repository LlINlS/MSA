id: "SC-CONF-01"
name: "Noslepumu atklasanas scenarijs"
threat_category: "Konfiguraciju draudi"
target_mechanism: "SecretManagement"
target_service: "http://localhost:8080"

parameters:
  target_endpoint: "/orders"
  sensitive_keywords:
    - "password"
    - "secret"
    - "key"
    - "token"
    - "api_key"
    - "private"
    - "credential"
    - "database"
  sub_scenarios:
    - "error_leak"
    - "header_leak"
    - "debug_endpoint"
    - "stack_trace"
    - "env_exposure"

steps:
  - "Ieladet scenarija konfiguraciju"
  - "Parbaudi vai kludu zinojumi atklaj sensitivus datus"
  - "Parbaudi vai HTTP galvenes atklaj servera informaciju"
  - "Parbaudi vai debug galapunkti ir pieejami"
  - "Parbaudi vai stack trace tiek atklats"
  - "Parbaudi vai vides mainigie ir pieejami"
  - "Generet atskaiti"

expected_result: "attack_blocked"