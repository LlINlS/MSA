[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Microservice-attack-simulation"
version = "0.1.0"
description = "Attack simulation framework for testing microservice communication."
readme = "README.md"
authors = [
  {name = "Linards Ruseckis", email = "linardsruseckis12@gmail.com"}
]
maintainers = [
  {name = "Linards Ruseckis", email = "linardsruseckis12@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "requests>=2.31.0",
  "PyYAML>=6.0",
  "PyJWT>=2.8.0",
  "cryptography>=41.0.0",
  "pydantic>=2.5.0",
]
requires-python = ">= 3.11"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/LlINlS/Microservice-attack-simulation/issues"
changelog = "https://github.com/LlINlS/Microservice-attack-simulation/releases"
documentation = "https://LlINlS.github.io/Microservice-attack-simulation/"
homepage = "https://github.com/LlINlS/Microservice-attack-simulation"

[project.scripts]
microservice_attack_simulation = "microservice_attack_simulation.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev"]
